# Copy to .github/workflows/linkedin.yml in a PRIVATE repository that contains
# your post-autopilot/ folder and the scripts/ folder from this skill.
# Add repository secrets: LINKEDIN_ACCESS_TOKEN, LINKEDIN_PERSON_URN (and LINKEDIN_ORG_ID if posting to a Page).
name: Publish scheduled LinkedIn posts

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: linkedin-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due posts
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
        run: python3 scripts/publish_posts.py --workspace post-autopilot
      - name: Save results
        run: |
          git config user.name "post-autopilot"
          git config user.email "post-autopilot@users.noreply.github.com"
          git add -A post-autopilot
          git diff --cached --quiet || (git commit -m "Published scheduled LinkedIn posts" && git push)
